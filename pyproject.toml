[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rfdetr"
version = "1.8.0.dev"
description = "RF-DETR"
readme = "README.md"
authors = [
    {name = "Roboflow, Inc", email = "develop@roboflow.com"}
]
license = {text = "Apache License 2.0"}
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS"
]
keywords = ["machine-learning", "deep-learning", "vision", "ML", "DL", "AI", "DETR", "RF-DETR", "Roboflow"]

dependencies = [
    "requests==2.34.2",                # weight download from remote URLs
    "torch==2.10.0",                   # core tensor ops and model forward pass
    "torchvision==0.25.0",             # image transforms and ops (aligned with torch==2.10.0)
    "tqdm==4.67.1",                    # progress bars during weight download; pinned to match onnx2tf 2.4.0
    "transformers==5.9.0",             # DINOv2 backbone loading
    "pydantic==2.13.4",                # ModelConfig / TrainConfig validation
    "supervision==0.28.0",             # inference output (Detections, Masks)
    "pyDeprecate==0.7.0",              # deprecation warnings for legacy APIs; >=0.6 for deprecated_class
]

[project.optional-dependencies]
lora = [
    "peft==0.19.1",                    # LoRA backbone fine-tuning
]
train = [
    "peft==0.19.1",                    # LoRA backbone fine-tuning (available during training)
    "pytorch_lightning==2.6.5",        # Keep >=2.6.4; see issue #1016 / related advisory for why 2.6.2 and 2.6.3 are blocked
    "torchmetrics[detection]==1.9.0",
    "faster-coco-eval==1.7.2",
    "pycocotools==2.0.11",
    "pyarrow==14.0.1",
    "scipy==1.17.1",
    "albumentations==2.0.8",
    "roboflow==1.3.9",
    "rf100vl==1.1.2",
]
onnx = [
    "onnx==1.20.1",
    "onnxsim==0.5.0",  # TODO: onnxsim 0.6.0+ hangs on install
    "onnx_graphsurgeon==0.6.1",
    "onnxruntime==1.24.3",
    "polygraphy==0.50.3",
]
trt = [
    "pycuda==2026.1",
    "onnxruntime-gpu==1.26.0",
    "tensorrt==11.0.0.114",
    "polygraphy==0.50.3",
]
tflite = [
    "onnx2tf==2.4.0",
    "flatbuffers==25.12.19",
    "onnx==1.20.1",
    "tf-keras==2.19.0",
    "tensorflow==2.19.1",
]
kornia = [
    "kornia==0.8.3",                   # GPU-side augmentation via on_after_batch_transfer
]
loggers = [
    "tensorboard==2.19.0",
    "protobuf==4.25.5",  # Pinned to match onnx2tf 2.4.0 while keeping tensorflow>=2.16 compatibility (see #1041)
    "wandb==0.27.0",
    "mlflow==3.12.0",
    "clearml==2.1.7",
]
visual = [
    "matplotlib==3.10.9",
    "pandas==2.3.3",
    "seaborn==0.13.2",
]
cli = ["jsonargparse[signatures]==4.49.0"]
plus = ["rfdetr_plus==1.0.2"]

[dependency-groups]
build = [
    "twine==6.2.0",
    "wheel==0.47.0",
    "build==1.5.0"
]

tests = [
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
  "pytest-rerunfailures==14.0",
  "pytest-timeout==2.4.0",
  "pytest-doctestplus==1.7.1",
]

typing = [
    "mypy==2.1.0",
    "numpy==2.3.5",
    "types-PyYAML==6.0.12.20260518",
    "types-requests==2.33.0.20260518",
    "types-tqdm==4.67.3.20260518",
]

docs = [
    "mkdocs-material[imaging]==9.7.6",
    "mkdocstrings==1.0.4",
    "mkdocstrings-python==2.0.3",
    "mike==2.2.0",
    "mkdocs-jupyter==0.26.3",
    "mkdocs-git-committers-plugin-2==2.5.0",
    "mkdocs-git-revision-date-localized-plugin==1.5.2",
]

[project.urls]
Homepage = "https://github.com/roboflow/rf-detr"

[project.scripts]
rfdetr = "rfdetr.cli:main"

[tool.uv]
# onnx2tf 2.4.0 pins ml-dtypes==0.5.1 unconditionally. Keep the override
# while the project is pinned to Python 3.12 because the [tflite] extra uses onnx2tf 2.4.0.
override-dependencies = [
    "ml-dtypes==0.5.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rfdetr*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
rfdetr = ["py.typed", "models/backbone/dinov2_configs/*.json"]

[tool.ruff]
fix = true
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming: lowercase variables (N806) and arguments (N803)
]
extend-select = [
    "RUF100",  # yesqa
]
ignore = [
    "E722",  # todo: Do not use bare `except`
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E402"]  # cell-local imports are intentional in percent-format scripts

[tool.docformatter]
wrap-summaries = 120
wrap-descriptions = 120

[tool.pytest.ini_options]
addopts = [
    "-v",                   # verbose output
    "--color=yes",          # colored output
    "--doctest-plus",       # run doctests from all modules (pytest-doctestplus)
]
pythonpath = ["src"]
markers = [
    "gpu: tests that require GPU or are slow on CPU",
    "flaky: tests that may fail due to nondeterminism",
    "tflite: tests requiring onnx2tf and TFLite dependencies",
]
filterwarnings = [
    # pytest-xdist workers close their channel before teardown completes;
    # this is a known false-positive that does not affect test results.
    "ignore::pluggy.PluggyTeardownRaisedWarning",
    # Many tests instantiate ModelConfig variants with `pretrain_weights=None`
    # to skip downloads.  The pretrain-compat warning is intentional UX for
    # end users; silence it globally for the test suite and re-enable it
    # explicitly in the dedicated tests via `warnings.catch_warnings` plus
    # `warnings.simplefilter("always")`.
    # NOTE: expressed as a message regex (not as
    # ``ignore::rfdetr.config.PretrainWeightsCompatibilityWarning``) because a
    # class-path filter forces pytest to import ``rfdetr.config`` at
    # config-parse time — before ``pytest-cov`` starts tracing — which makes
    # the module's top-level statements appear uncovered.
    "ignore:.*was instantiated with pretrain_weights=None:UserWarning",
    "ignore:.*was instantiated with overrides that differ from the variant:UserWarning",
]

[tool.codespell]
skip = "*.pth"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = false
explicit_package_bases = true
strict = true
mypy_path = "src"
exclude = [
  "^docs/(hooks|scripts)/",
]
overrides = [
  { module = [
    "tests.*",
    "einops", "einops.*",
    "matplotlib", "matplotlib.*",
    "pandas", "pandas.*",
    "seaborn", "seaborn.*",
  ], ignore_errors = true },
  { module = [
    "torchvision", "torchvision.*",
    "pycocotools", "pycocotools.*",
    "timm", "timm.*",
    "einops", "einops.*",
    "deprecate", "deprecate.*",
    "matplotlib", "matplotlib.*",
    "pandas", "pandas.*",
    "requests", "requests.*",
    "seaborn", "seaborn.*",
    "tqdm", "tqdm.*",
    "kornia", "kornia.*",
    "onnx", "onnx.*",
    "onnx2tf", "onnx2tf.*",
    "onnx_graphsurgeon", "onnx_graphsurgeon.*",
    "onnxruntime", "onnxruntime.*",
    "tflite_runtime", "tflite_runtime.*",
    "tensorflow", "tensorflow.*",
  ], ignore_missing_imports = true },
  # Modules with pre-existing type errors — ignored until incrementally fixed.
  { module = [
    "rfdetr",
    "rfdetr._namespace",
    "rfdetr.assets.model_weights",
    "rfdetr.config",
    "rfdetr.datasets._develop",
    "rfdetr.datasets.coco",
    "rfdetr.datasets.save_grids",
    "rfdetr.datasets.synthetic",
    "rfdetr.datasets.transforms",
    "rfdetr.datasets.yolo",
    "rfdetr.detr",
    "rfdetr.evaluation.coco_eval",
    "rfdetr.evaluation.matching",
    "rfdetr.export._onnx.exporter",
    "rfdetr.export._onnx.symbolic",
    "rfdetr.export.benchmark",
    "rfdetr.export.main",
    "rfdetr.export.tensorrt",
    "rfdetr.models.backbone",
    "rfdetr.models.backbone.backbone",
    "rfdetr.models.backbone.base",
    "rfdetr.models.backbone.dinov2",
    "rfdetr.models.backbone.dinov2_with_windowed_attn",
    "rfdetr.models.backbone.projector",
    "rfdetr.models.criterion",
    "rfdetr.models.heads.detection",
    "rfdetr.models.heads.segmentation",
    "rfdetr.models.lwdetr",
    "rfdetr.models.math",
    "rfdetr.models.matcher",
    "rfdetr.models.ops.functions.ms_deform_attn_func",
    "rfdetr.models.ops.modules.ms_deform_attn",
    "rfdetr.models.position_encoding",
    "rfdetr.models.postprocess",
    "rfdetr.models.transformer",
    "rfdetr.models.weights",
    "rfdetr.platform",
    "rfdetr.platform.downloads",
    "rfdetr.platform.models",
    "rfdetr.training.callbacks.best_model",
    "rfdetr.training.callbacks.coco_eval",
    "rfdetr.training.callbacks.drop_schedule",
    "rfdetr.training.callbacks.ema",
    "rfdetr.training.cli",
    "rfdetr.training.drop_schedule",
    "rfdetr.training.model_ema",
    "rfdetr.training.module_data",
    "rfdetr.training.module_model",
    "rfdetr.training.trainer",
    "rfdetr.utilities.distributed",
    "rfdetr.utilities.logger",
    "rfdetr.utilities.state_dict",
    "rfdetr.utilities.tensors",
    "rfdetr.variants",
  ], ignore_errors = true },
]
